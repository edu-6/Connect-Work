<app-header></app-header>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            
            @if (!editando()) {
                <app-comision-card 
                    [porcentaje]="porcentajeActual()" 
                    (editar)="editando.set(true)">
                </app-comision-card>
            } @else {
                <app-comision-form 
                    [comisionEnEdicion]="comisionGlobal!"
                    (cambioExitoso)="onCambioExitoso()"
                    (cancelar)="editando.set(false)">
                </app-comision-form>
            }
        </div>
    </div>
</div>
