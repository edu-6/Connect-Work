<form [formGroup]="formulario" (submit)="enviar()">
    <section class="vh-20">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-10 col-lg-8">

                    @if (hayError()) {
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error!</strong> {{mensajeError}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    }

                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5">

                            <h3 class="mb-5 text-center">Perfil de Cliente</h3>

                            <div class="row mb-4">
                                <div class="col-md-12 mb-4 mb-md-0">
                                    <label class="form-label">Descripción: </label>
                                    <textarea class="form-control" formControlName="descripcion" rows="4"
                                        [class.is-invalid]="formulario.controls['descripcion']?.invalid && intentoEnviarlo()"></textarea>
                                    <div class="invalid-feedback">
                                        Descripción es requerida
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label class="form-label">Sitio Web: </label>
                                    <input type="text" class="form-control" formControlName="sitioWeb"
                                        [class.is-invalid]="formulario.controls['sitioWeb']?.invalid && intentoEnviarlo()"
                                        placeholder="https://...">
                                    <div class="invalid-feedback">
                                        Se requiere una URL válida
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Industria/Sector: </label>
                                    <input type="text" class="form-control" formControlName="industria"
                                        [class.is-invalid]="formulario.controls['industria']?.invalid && intentoEnviarlo()">
                                    <div class="invalid-feedback">
                                        Sector o industria es requerido
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <button class="btn btn-primary w-100 py-2" type="submit">Guardar Perfil</button>
                            </div>

                            <div class="mt-4">
                                <button type="button" class="btn btn-secondary py-2 w-100"
                                    (click)="redirigirAHome()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
