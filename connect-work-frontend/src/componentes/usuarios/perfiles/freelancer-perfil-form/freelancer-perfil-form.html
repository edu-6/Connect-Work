<form [formGroup]="formulario" (submit)="enviar()">
    <section class="vh-20">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-10 col-lg-8">

                    @if (hayError()) {
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error!</strong> {{mensajeError}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    }

                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5">

                            <h3 class="mb-5 text-center">Perfil de Freelancer</h3>

                            <div class="row mb-4">
                                <div class="col-md-12 mb-4 mb-md-0">
                                    <label class="form-label">Biografía: </label>
                                    <textarea class="form-control" formControlName="biografia" rows="4"
                                        [class.is-invalid]="formulario.controls['biografia']?.invalid && intentoEnviarlo()"></textarea>
                                    <div class="invalid-feedback">
                                        Biografía es requerida
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label class="form-label">Tarifa por Hora: </label>
                                    <input type="number" step="0.01" class="form-control" formControlName="tarifaHora"
                                        [class.is-invalid]="formulario.controls['tarifaHora']?.invalid && intentoEnviarlo()">
                                    <div class="invalid-feedback">
                                        Tarifa por hora es requerida
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Nivel de Experiencia: </label>
                                    <select class="form-control" formControlName="idNivelExperiencia"
                                        [class.is-invalid]="formulario.controls['idNivelExperiencia']?.invalid && intentoEnviarlo()">
                                        <option [ngValue]="null" disabled selected>Seleccione nivel de experiencia
                                        </option>
                                        @for (n of nivelesExperiencia(); track n.id) {
                                        <option [value]="n.id">
                                            {{ n.nombre }}
                                        </option>
                                        }
                                    </select>
                                    <div class="invalid-feedback">
                                        Seleccione un nivel de experiencia
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <button class="btn btn-primary w-100 py-2" type="submit">Guardar</button>
                            </div>

                            <div class="mt-4">
                                <button type="button" class="btn btn-secondary py-2 w-100"
                                    (click)="redirigirAHome()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
