<div class="card shadow h-100">
    <div class="card-header text-center bg-light">
        <div class="fw-bold fs-5 text-truncate">
            {{proyecto.nombre}}
        </div>
    </div>

    <div class="card-body d-flex flex-column">

        <div class="mb-3 text-muted small">
            <span class="me-4 text-success">
                <i class="bi bi-calendar-plus"></i> Publicado: {{proyecto.fechaCreacion}}
            </span>
            <span>
                <i class="bi bi-calendar-check"></i> Entrega: {{proyecto.fechaEntregaDeseada}}
            </span>
        </div>

        <div class="mb-3 text-muted small">
            <span class="me-4">
                <h5><i class="bi bi-person-circle"></i> Cliente: {{proyecto.nombreCliente}}</h5>
            </span>
            <span>
                <h5><i class="bi bi-tag-fill"></i> Categoría: {{proyecto.categoria}}</h5>
            </span>
        </div>

        <div class="mb-3 small">
            <span class="fw-bold text-danger fs-5">
                <i class="bi bi-currency-dollar"></i> Presupuesto Máximo: {{proyecto.presupuestoMaximo}}
            </span>
        </div>

        <div class="flex-grow-1 d-flex justify-content-center align-items-center mb-4">
            <div class="card w-100">
                <div class="card-body">
                    <h6 class="card-title text-muted">Estado del Proyecto</h6>
                    <p class="card-text fw-bold text-primary">{{proyecto.estado}}</p>
                </div>
            </div>
        </div>

        @if(true){
        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
            <a [routerLink]="['/proyectos/detalle-page', proyecto.id]" class="btn btn-outline-primary btn-sm px-3">
                <i class="bi bi-eye-fill me-1"></i> Visualizar
            </a>
            
            <a [routerLink]="['/proyectos/form-page', proyecto.id]" class="btn btn-warning btn-sm px-3">
                <i class="bi bi-pencil-square me-1"></i> Editar
            </a>
        </div>
        }

    </div>
</div>
