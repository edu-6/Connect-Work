<form [formGroup]="formulario" (submit)="enviar()">
    <section class="py-5">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-10 col-lg-8">

                    @if (hayError()) {
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error!</strong> {{mensajeError}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    }

                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5">
                            <h3 class="mb-5 text-center">{{ enEdicion() ? 'Editar Proyecto' : 'Crear Nuevo Proyecto' }}</h3>

                            <div class="mb-4">
                                <label class="form-label">Nombre del Proyecto: </label>
                                <input type="text" class="form-control" formControlName="nombre"
                                    [class.is-invalid]="formulario.controls['nombre'].invalid && intentoEnviarlo()">
                                <div class="invalid-feedback">El nombre es requerido.</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Descripción: </label>
                                <textarea class="form-control" formControlName="descripcion" rows="3"
                                    [class.is-invalid]="formulario.controls['descripcion'].invalid && intentoEnviarlo()"></textarea>
                                <div class="invalid-feedback">La descripción es requerida.</div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6 mb-4 mb-md-0">
                                    <label class="form-label">Categoría: </label>
                                    <select class="form-control" formControlName="idCategoria"
                                        [class.is-invalid]="formulario.controls['idCategoria'].invalid && intentoEnviarlo()">
                                        <option [ngValue]="null" disabled selected>Seleccione categoría</option>
                                        @for (cat of categorias(); track cat.id) {
                                        <option [value]="cat.id">{{ cat.nombre }}</option>
                                        }
                                    </select>
                                    <div class="invalid-feedback">Seleccione una categoría.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Presupuesto Máximo ($): </label>
                                    <input type="number" class="form-control" formControlName="presupuestoMaximo"
                                        [class.is-invalid]="formulario.controls['presupuestoMaximo'].invalid && intentoEnviarlo()">
                                    <div class="invalid-feedback">Ingrese un presupuesto válido.</div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha de Entrega Deseada: </label>
                                    <input type="date" class="form-control" formControlName="fechaEntregaDeseada"
                                        [class.is-invalid]="formulario.controls['fechaEntregaDeseada'].invalid && intentoEnviarlo()">
                                    <div class="invalid-feedback">La fecha es requerida.</div>
                                </div>
                                
                            </div>

                            <div class="mt-3">
                                <button class="btn btn-primary w-100 py-2" type="submit">
                                    Guardar
                                </button>
                            </div>

                            <div class="mt-4">
                                <button type="button" class="btn btn-secondary py-2 w-100" (click)="cancelar()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
