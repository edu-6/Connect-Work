<form [formGroup]="formulario" (submit)="enviar()">
    <section class="mt-4 mb-4">
        <div class="container py-4">
            <div class="row d-flex justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">


                    @if (hayError ()) {
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error! </strong> {{mensajeError}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    }

                    <div class="card shadow-2-strong" style="border-radius: 1rem;">
                        <div class="card-body p-5">
                            @if(enEdicion()){
                            <h3 class="mb-5 text-center">{{mensajeEdicion}}</h3>
                            }@else {
                            <h3 class="mb-5 text-center">{{mensajeCreacion}}</h3>
                            }

                            <label class="form-label">Nombre:</label>
                            <input type="text" class="form-control" name="name" formControlName="nombre"
                                [class.is-invalid]="formulario.controls['nombre'].invalid && intentoEnviarlo()">
                            <div class="invalid-feedback">
                                <div>
                                    Nombre (Max 30)
                                </div>
                            </div>

                            <br>

                            <div class="form-check form-switch mt-4 mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" id="activaSwitch"
                                    formControlName="activa">
                                <label class="form-check-label" for="activaSwitch">Activa</label>
                            </div>

                            <div class=" mt-4">
                                <button class="btn btn-primary w-100 py-3" type="submit">Guardar</button>
                            </div>
                            <div class="mt-4">
                                <button type="button" routerLink="/habilidades"
                                    class="btn btn-secondary py-3 w-100">Regresar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
