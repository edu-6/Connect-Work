
<div class="card shadow border-0">
  <div class="card-header text-center py-3">
    <div class="fw-semibold fs-5 text-uppercase">Mi Cartera</div>
  </div>
  <div class="card-body text-center p-5">
    <p class="text-muted mb-2">Saldo disponible</p>
    <h2 class="display-3 fw-bold text-success">Q{{saldo.toFixed(2)}}</h2>
    <div class="mt-4">

      @if(esCliente()){
              <button (click)="editar.emit()" class="btn btn-success px-5 py-2">
        Recargar Saldo
      </button>
      }

    </div>
  </div>
</div>
