<form [formGroup]="formulario" (submit)="enviar()">
  <div class="card shadow">
    <div class="card-body p-3">

      @if (hayError()) {
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{mensajeError}}
        <button type="button" class="btn-close" (click)="hayError.set(false)"></button>
      </div>
      }

      <div class="mb-3">
        <label class="form-label fw-bold">Motivo del rechazo</label>
        <textarea
          class="form-control"
          rows="3"
          formControlName="motivo"
          placeholder="Ingrese el motivo..."
          [class.is-invalid]="formulario.controls['motivo'].invalid && intentoEnviarlo()">
        </textarea>
        <div class="invalid-feedback">
          El motivo es obligatorio (máximo 300 caracteres).
        </div>
      </div>

      <button class="btn btn-danger w-100" type="submit">
        Rechazar Propuesta
      </button>

      <br>
      <br>
      <button class="btn btn-primary w-100" type="btn" (click)="cancelarRechazo()">
        Cancelar
      </button>

    </div>
  </div>
</form>
