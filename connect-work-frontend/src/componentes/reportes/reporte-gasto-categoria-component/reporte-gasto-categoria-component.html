<h4 class="text-center mt-4">Gasto Acumulado por Categoría</h4>
<br>

<div class="table-responsive">
  <table class="table table-striped border">
    <thead class="table-light">
      <tr>
        <th scope="col" style="width: 10%">#</th>
        <th scope="col">Categoría de Servicio</th>
        <th scope="col" class="text-end">Total Gastado</th>
      </tr>
    </thead>
    <tbody>
      @for (item of datos; track $index; let i = $index) {
      <tr>
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ item.nombreCategoria }}</td>
        <td class="text-end fw-bold">
          Q.{{ item.totalGastado.toFixed(2) }}
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="3" class="text-center text-muted py-4">
          No hay gastos en este periodo.
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
