<h4 class="text-center mt-4">Top 5 Categorías mas trabajadas</h4>
<br>

<div class="table-responsive">
  <table class="table table-striped border">
    <thead class="thead-light">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Categoría</th>
        <th scope="col">Contratos</th>
        <th scope="col" class="text-end">Total de Ingresos</th>
      </tr>
    </thead>
    <tbody>
      @for (item of datos; track $index; let i = $index) {
      <tr>
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ item.nombreCategoria }}</td>
        <td>{{ item.cantidadContratos }}</td>
        <td class="text-end fw-bold">
          Q.{{ item.totalIngresos.toFixed(2) }}
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="4" class="text-center text-muted py-4">
          No hay datos suficientes para generar el Top 5.
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
