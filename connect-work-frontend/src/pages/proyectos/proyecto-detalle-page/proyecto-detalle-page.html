<app-header></app-header>

<div class="container mt-5">

    @if (hayError()) {
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Error! </strong> {{mensajeError}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    }

    @if(encontrado()){
    <div class="row justify-content-center">
        <div class="col-md-10">


            <div class="mb-4">
                <app-proyecto-card [proyecto]="proyecto" [mostrarBtnEditar]="false"></app-proyecto-card>
            </div>

            <div class="card shadow">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-file-text me-2"></i> Descripción del Proyecto
                </div>
                <div class="card-body">
                    <p style="white-space: pre-wrap;">{{proyecto.descripcion}}</p>
                </div>
            </div>


            <div class="mt-4 d-flex justify-content-end">
                <button class="btn btn-secondary px-4" onclick="history.back()">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </button>
            </div>

        </div>
    </div>
    }@else {
        no se encontró 
    }
</div>
