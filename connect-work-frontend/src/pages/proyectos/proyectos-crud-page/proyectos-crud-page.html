<app-header></app-header>

<div class="container text-center my-5">

    <div class="d-flex flex-column align-items-center gap-3 w-100">


        @if (hayError()) {
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error! </strong> {{mensajeError}}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        }

        <h3>Filtrar por rango</h3>
        <div [formGroup]="barraBusqueda" class="d-flex justify-content-center gap-2 w-50">
            <input class="form-control flex-grow-1" type="date" placeholder="Search" formControlName="busqueda">
            <input class="form-control flex-grow-1" type="date" placeholder="Search" formControlName="busqueda">

            <button class="btn btn-primary" (click)="buscarProyectos()">
                Filtrar
            </button>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a routerLink="/proyectos-form-page" class="btn btn-primary">
                <i class="bi bi-file-earmark-plus"></i> Nuevo proyecto
            </a>
            <button type="button" class="btn btn-secondary" (click)="buscarTodos()">
                Todos tus proyectos
            </button>
        </div>
    </div>
</div>



@if(buscandoTodos()){
<div class="row row-cols-1 row-cols-md-3 g-4">
    @for (proyecto of proyectos(); track proyecto.id) {
    <app-proyecto-card [proyecto]="proyecto"></app-proyecto-card>
    }
</div>
}

@if(buscandoUno()){
<div class="d-flex justify-content-center mt-4">
    <div style="width: 100%; max-width: 400px;">
        <app-proyecto-card [proyecto]="proyectoEncontrado()!"></app-proyecto-card>
        
    </div>
</div>
}
