<app-header></app-header>

<div class="container text-center my-5">

    <div class="d-flex flex-column align-items-center gap-3 w-100">

        @if (hayError()) {
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error! </strong> {{mensajeError}}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        }

        <h3>Buscar ofertas</h3>

        
        <div [formGroup]="barraBusqueda" class="d-flex justify-content-center gap-2 w-50">
            
            <select class="form-control flex-grow-1" formControlName="idBusqueda" (change)="cambiarTipoBusqueda()">
                <option [ngValue]="null" disabled selected>Tipo de búsqueda</option>
                <option [value]="tiposBusqueda.POR_PRESUPUESTO">Por Presupuesto</option>
                <option [value]="tiposBusqueda.POR_CATEGORIA">Por Categoría</option>
                <option [value]="tiposBusqueda.POR_HABILIDAD">Por Habilidad</option>
            </select>

            @if (mostrarPresupuesto()) {
                <input class="form-control flex-grow-1" type="number" placeholder="Min" formControlName="minPresupuesto">
                <input class="form-control flex-grow-1" type="number" placeholder="Max" formControlName="maxiPresupuesto">
            }

            @if (mostrarCategoria()) {
                <select class="form-control flex-grow-1" formControlName="idCategoria">
                    <option [ngValue]="null" disabled selected>Categoría</option>
                    @for (cat of categorias(); track cat.id) {
                        <option [value]="cat.id">{{cat.nombre}}</option>
                    }
                </select>
            }

            @if (mostrarHabilidad()) {
                <select class="form-control flex-grow-1" formControlName="idHabilidad">
                    <option [ngValue]="null" disabled selected>Habilidad</option>
                    @for (hab of habilidades(); track hab.id) {
                        <option [value]="hab.id">{{hab.nombre}}</option>
                    }
                </select>
            }

            <button class="btn btn-primary" (click)="realizarBusqueda()">
                Filtrar
            </button>
        </div>


        
        <div class="row w-100 mt-4">
            @for (proy of proyectos(); track proy.id) {
                <div class="col-md-4 mb-4">
                    <app-proyecto-card [proyecto]="proy" [mostrarBtnEditar]="false" ></app-proyecto-card>
                </div>
            }
        </div>
    </div>
</div>
