<app-header></app-header>

<div class="container text-center my-5">

    <div class="d-flex flex-column align-items-center gap-3 w-100">

        <div [formGroup]="barraBusqueda" class="d-flex justify-content-center gap-2 w-50">
            <input class="form-control flex-grow-1" type="search-primary" placeholder="Search"
                formControlName="busqueda">

            <button class="btn btn-primary" (click)="buscarHabilidad()">
                Search
            </button>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a routerLink="/habilidades-form-page" class="btn btn-primary">
                <i class="bi bi-file-earmark-plus"></i> Nueva habilidad
            </a>
            <button type="button" class="btn btn-secondary" (click)="buscarTodos()">
                Todas las habilidades
            </button>
        </div>


       <!-- @if (hayError) {

        </div>
        }-->
    </div>
</div>

@if(buscandoTodos()){
<div class="row row-cols-1 row-cols-md-3 g-4">
    @for (habilidad of habilidades(); track habilidad.id) {
        <app-habilidad-card [habilidad] ="habilidad"></app-habilidad-card>
    }
</div>
}





@if(buscandoUno()){
<div class="d-flex justify-content-center mt-4">
    <div style="width: 100%; max-width: 400px;">
        <app-habilidad-card [habilidad]="habilidadEncontrada()!"></app-habilidad-card>
    </div>
</div>
}
